<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 Forbidden</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #ffffff; color: #111827; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .box { text-align: center; max-width: 460px; }
    h1 { font-size: 30px; font-weight: 700; color: #111827; margin-bottom: 12px; letter-spacing: -0.5px; }
    p { font-size: 15px; color: #4b5563; line-height: 1.6; margin-bottom: 24px; }
    .meta { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; color: #9ca3af; border-top: 1px solid #e5e7eb; padding-top: 16px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>403 Forbidden</h1>
    <p>Access denied. Your request was blocked in accordance with the corporate security policy.</p>
    <div class="meta">Event Reference: sec-waf-block</div>
  </div>
</body>
</html>
